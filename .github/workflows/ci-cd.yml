name: CI and container delivery

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run PHP checks in Docker
        run: docker build --target checks -t bantayklima:checks .
      - name: Check application JavaScript
        run: find assets -maxdepth 1 -type f -name '*.js' -exec sh -ec 'for file do node --check "$file"; done' sh '{}' +
      - name: Verify classroom demonstration secret
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v')))
        env:
          DEMO_API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: |
          if [ -z "$DEMO_API_KEY" ]; then
            echo "Set the DEMO_API_KEY repository secret before running this workflow on main or a release tag."
            exit 1
          fi
          echo "Demonstration secret is configured."
      - name: Smoke test production container
        run: |
          docker compose up --build --wait --wait-timeout 90
          base=http://127.0.0.1:8080
          curl --fail --silent --show-error "$base/" | grep 'id="weather"'
          curl --fail --silent --show-error "$base/api/risk.php" | jq -e '.rows | length == 30'
          curl --fail --silent --show-error "$base/api/timeline.php?town=1" | jq -e '.events | type == "array"'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/weather.php")" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/weather.php?town=999999")" = 404
          for private in data/bantayklima.sqlite config.php uploads/ cli/refresh.php lib/bootstrap.php; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "$base/$private")" = 403
          done
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Remove smoke-test containers
        if: always()
        run: docker compose down --volumes

  deliver:
    needs: verify
    if: github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and publish to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=latest
          fi
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$image:sha-$GITHUB_SHA" --tag "$image:$tag" .
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:$tag"
